# Проверка и выпуск без компьютера владельца.
# Любой push в main: ставит зависимости и проверяет типы.
# Если в сообщении коммита есть [build] (или запуск вручную с build=true) —
# код переносится в ветку release, а Expo (.eas/workflows/release.yml)
# собирает iOS и Android и отправляет iOS в App Store Connect.
name: Check & release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build:
        description: 'Запустить сборку (перенести в release)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Native packages (versions picked by Expo for this SDK)
        run: |
          npx expo install expo-store-review -- --legacy-peer-deps
          npx expo install --check || npx expo install --fix -- --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Commit updated package files
        run: |
          if ! git diff --quiet -- package.json package-lock.json app.json; then
            git config user.name "release-bot"
            git config user.email "release-bot@users.noreply.github.com"
            git add package.json package-lock.json app.json
            git commit -m "chore: sync native packages [skip ci]"
            git push origin HEAD:main
          fi

      - name: Hand over to Expo build
        if: contains(github.event.head_commit.message, '[build]') || github.event.inputs.build == 'true'
        run: git push --force origin HEAD:release
