<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Черная касса</title>
<meta name="theme-color" content="#141413">
<style>
  body { margin:0; min-height:100vh; background:#141413; color:#efe9dd; font:16px/1.45 -apple-system, system-ui, sans-serif; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main { max-width:420px; display:flex; flex-direction:column; gap:14px; }
  h1 { margin:0; font-size:30px; line-height:1.1; text-transform:uppercase; }
  p { margin:0; color:#9b9486; }
  .coin { width:40px; height:40px; border-radius:50%; border:5px solid #d9a441; display:grid; place-items:center; color:#d9a441; font-weight:800; }
</style>
</head>
<body>
<main>
  <div class="coin">₸</div>
  <h1>Черная касса</h1>
  <p>Касса по очереди для своих: жеребьёвка месяцев, сбор на встрече и тихие долги на Kaspi. Приглашение приходит ссылкой от организатора.</p>
</main>
</body>
</html>
