# Сборка в облаке Expo: запускается, когда GitHub Actions переносит проверенный код в ветку release.
name: Release builds

on:
  push:
    branches: ['release']

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production

  submit_ios:
    name: Submit iOS to App Store Connect
    needs: [build_ios]
    type: submit
    env:
      EXPO_DEBUG: '1'
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
